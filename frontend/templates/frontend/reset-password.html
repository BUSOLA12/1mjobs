{% load static %}
<!doctype html>
<html lang="en">

<head>

    <!-- Basic Page Needs
================================================== -->
    <title>Reset Password</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- CSS
================================================== -->
    {% include 'frontend/partials/css_links.html' %}

</head>

<body>

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Header Container
================================================== -->
        {% include 'frontend/partials/headers.html' %}

        <!-- Header Container / End -->

        <!-- Titlebar
================================================== -->
        <div id="titlebar" class="gradient">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">

                        <h2>Reset Password</h2>

                        <!-- Breadcrumbs -->
                        <nav id="breadcrumbs" class="dark">
                            <ul>
                                <li><a href="{% url 'login' %}">Log In</a></li>
                                <li>Reset Password</li>
                            </ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>


        <!-- Page Content
================================================== -->
        <div class="container">
            <div class="row">
                <div class="col-xl-5 offset-xl-3">

                    <form id="resetForm">

                        <input type="password" id="new_password" placeholder="New Password" required>
                        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
                        <button class="button" type="submit">
                            Reset Password
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>

    {% include 'frontend/partials/scripts.html' %}
    <script src="{% static 'js/for/reset-password.js' %}"></script>

</body>

</html>
