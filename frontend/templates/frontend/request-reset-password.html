{% load static %}
<!doctype html>
<html lang="en">

<head>

    <!-- Basic Page Needs
================================================== -->
    <title>Reset Password</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- CSS
================================================== -->
    {% include 'frontend/partials/css_links.html' %}

</head>

<body>

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Header Container
================================================== -->
        {% include 'frontend/partials/headers.html' %}

        <!-- Header Container / End -->

        <!-- Titlebar
================================================== -->
        <div id="titlebar" class="gradient">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">

                        <h2>Reset Password</h2>

                        <!-- Breadcrumbs -->
                        <nav id="breadcrumbs" class="dark">
                            <ul>
                                <li><a href="{% url 'login' %}">Log In</a></li>
                                <li>Reset Password</li>
                            </ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>


        <!-- Page Content
================================================== -->
        <div class="container">
            <div class="row">
                <div class="col-xl-5 offset-xl-3">

                    <form id="requestResetForm">

                        <input type="email" id="email" placeholder="Enter email ..." required>

                        <button class="button full-width button-sliding-icon ripple-effect" type="submit">
                            Send Reset Link
                        </button>

                    </form>

                </div>
            </div>
        </div>

        {% include 'frontend/partials/scripts.html' %}

        <script>
            document.getElementById('requestResetForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const btn = e.target.querySelector('button[type="submit"]');
                const originalBtnText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = 'Sending...';

                try {
                    const response = await fetch('/api/auth/reset-password/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}' 
                        },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        appendError(data.detail, "success")
                    } else {
                        console.error('Error:', data);
                        appendError("Error sending reset link.")
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again later.');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalBtnText;
                }
            });
        </script>

</body>

</html>
