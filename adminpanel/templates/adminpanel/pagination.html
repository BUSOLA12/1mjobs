{% if is_paginated %}
    <nav class="mt-4">
        <ul class="pagination">

            {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link"
                    href="?page={{ page_obj.previous_page_number }}&q={{ current_q }}&user_type={{ current_user_type }}">
                    Previous
                </a>
            </li>
            {% endif %}

            <li class="page-item active">
                <span class="page-link">
                    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
                </span>
            </li>

            {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link"
                    href="?page={{ page_obj.next_page_number }}&q={{ current_q }}&user_type={{ current_user_type }}">
                    Next
                </a>
            </li>
            {% endif %}

        </ul>
    </nav>
    {% endif %}
