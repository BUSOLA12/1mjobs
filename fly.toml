# fly.toml — Fly.io configuration for the 1mjobs Django app.

app = 'one-million-jobs'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[env]
  DEBUG = 'False'
  SQLITE_PATH = '/data/db.sqlite3'
  MEDIA_ROOT = '/data/media'
  # No managed Redis yet -> single-machine in-process channel layer for messaging.
  USE_INMEMORY_CHANNELS = 'True'
  EXTRA_ALLOWED_HOSTS = 'one-million-jobs.fly.dev,onemillionjobs.com.ng,www.onemillionjobs.com.ng'
  CSRF_EXTRA_ORIGINS = 'https://one-million-jobs.fly.dev,https://onemillionjobs.com.ng,https://www.onemillionjobs.com.ng'

# Persistent volume for the SQLite database and uploaded media.
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine running so WebSocket messaging stays available.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
