<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 0; background-color: #f5f7fa; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; }
    .email-wrapper { width: 100%; padding: 20px; background-color: #f5f7fa; }
    .email-content { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .email-header { background: #07c407ff; color: #fff; padding: 20px; text-align: center; }
    .email-header h1 { margin: 0; font-size: 20px; }
    .email-body { padding: 30px; font-size: 15px; line-height: 1.6; }
    .email-body h2 { color: #007bff; margin-top: 0; }
    .email-footer { background: #f0f0f0; padding: 20px; text-align: center; font-size: 13px; color: #777; }
    .button { display: inline-block; background: #007bff; color: #ffffff !important; text-decoration: none; padding: 10px 22px; border-radius: 5px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-content">
      <div class="email-header">
        <h1>Opportunity Hub</h1>
      </div>
      <div class="email-body">
        <h2>{{ title }}</h2>
        {% for line in lines %}<p>{{ line }}</p>{% endfor %}
        {% if link %}
        <p style="text-align: center;">
          <a href="{{ link }}" class="button">View contract</a>
        </p>
        {% endif %}
      </div>
      <div class="email-footer">
        &copy; 2026 Opportunity Hub. All rights reserved.
        <br>
        <a href="{{ site_url }}">Visit our website</a>
      </div>
    </div>
  </div>
</body>
</html>
